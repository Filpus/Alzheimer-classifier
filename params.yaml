make_dataset:
  window_size: 3.0
  dataset_name: brainlat
  raw_dir: data/raw/brainlat
  processed_dir: data/processed
train:
  batch_size: 64
  learning_rate: 0.001
  epochs: 30
  n_splits: 5
random_forest:
  n_estimators: 100
  max_depth: 10
  random_stat: 42
cpc:
  epochs: 10
  learning_rate: 0.001
  context_dim: 128
  prediction_steps: 4
tnc:
  epochs: 10
  learning_rate: 0.001
  neighbor_range: 3
  num_samples: 5
  w: 0.05
mamba:
  epochs: 5
  learning_rate: 0.001
  d_model: 64
  d_state: 16